name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and audit environment
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -e ".[dev]"
      - name: pip-audit
        # CVE-2026-45829: ChromaDB Python FastAPI server RCE; no fix on PyPI as of 2026-05.
        # Aria uses HttpClient only; Chroma runs on the internal Docker network (see docker-compose.yml).
        run: pip-audit --ignore-vuln CVE-2026-45829
